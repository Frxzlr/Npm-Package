name: New diagnosis
description: An error whycrash doesn't explain (or explains badly)
labels: [diagnosis]
body:
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full error as printed (redact secrets, tokens and private paths).
      render: text
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: What was the actual cause?
      description: If you found it — this is what the diagnosis should say.
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A few lines of code (and files) that trigger the error, if possible.
      render: js
  - type: input
    id: versions
    attributes:
      label: Node.js version and OS
      placeholder: Node.js 24.11.0, macOS 15
    validations:
      required: true
